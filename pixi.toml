[workspace]
channels = ["https://prefix.dev/conda-forge","conda-forge","nvidia"]
name = "metaflowdemo"
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
version = "0.1.0"

[tasks]
# MetaFlow development server tasks
metaflow-dev-up = "pixi run metaflow-dev up"
# Simple port check tasks for MetaFlow
metaflow-check-port-3000 = { cmd = "echo \"Checking localhost:3000...\" && timeout 30 curl -s http://localhost:3000 >/dev/null && echo \"✓ localhost:3000 is responding\" || (echo \"✗ localhost:3000 failed to respond within 30s\" && exit 1)" }
metaflow-check-port-10350 = { cmd = "echo \"Checking localhost:10350...\" && timeout 30 curl -s http://localhost:10350 >/dev/null && echo \"✓ localhost:10350 is responding\" || (echo \"✗ localhost:10350 failed to respond within 30s\" && exit 1)" }
metaflow-check-port-8083 = { cmd = "echo \"Checking localhost:8083...\" && timeout 30 curl -s http://localhost:8083 >/dev/null && echo \"✓ localhost:8083 is responding\" || (echo \"✗ localhost:8083 failed to respond within 30s\" && exit 1)" }

# Combined wait task that depends on all port checks
metaflow-dev-wait = { cmd = "echo \"Verifying MetaFlow dev stack deployment...\" && echo \"🎉 All MetaFlow services are deployed and responding!\"", depends-on = ["metaflow-check-port-3000", "metaflow-check-port-10350", "metaflow-check-port-8083"] }
metaflow-dev-shell = { cmd = "pixi run metaflow-dev shell", depends-on = ["metaflow-dev-wait"] }

# Workflow execution tasks with dependencies
gradient_boosted_trees_flow = { cmd = "python src/workflows/metaflow/gradient_boosted_trees_flow.py run" }
neural_network_flow = { cmd = "python src/workflows/metaflow/neural_network_flow.py run", depends-on = ["gradient_boosted_trees_flow"] }
nlp_pipeline_flow = { cmd = "python src/workflows/metaflow/nlp_pipeline_flow.py run", depends-on = ["neural_network_flow"] }
parallel_branches_flow = { cmd = "python src/workflows/metaflow/parallel_branches_flow.py run", depends-on = ["nlp_pipeline_flow"] }
timeseries_forecasting_flow = { cmd = "python src/workflows/metaflow/timeseries_forecasting_flow.py run", depends-on = ["parallel_branches_flow"] }
tinygrad_llm_flow = { cmd = "python src/workflows/metaflow/tinygrad_llm_flow.py run", depends-on = ["timeseries_forecasting_flow"] }

# Final cleanup task
metaflow-dev-down = "pixi run metaflow-dev down"

# ZenML development server tasks
zenml-server-up = "pixi run zenml login --local --ip-address 0.0.0.0"
zenml-server-wait = { cmd = "echo \"Verifying ZenML server deployment...\" && echo \"Checking localhost:8080...\" && timeout 30 curl -s http://localhost:8237 >/dev/null && echo \"✓ ZenML server is responding on port 8080\" || (echo \"✗ ZenML server failed to respond within 30s\" && exit 1) && echo \"🎉 ZenML server is deployed and responding!\"", depends-on = ["zenml-server-up"] }

# ZenML workflow execution tasks with dependencies
gradient_boosted_trees_zen = { cmd = "python src/workflows/zenml/gradient_boosted_trees_zen.py", depends-on = ["zenml-server-wait"] }
neural_network_zen = { cmd = "python src/workflows/zenml/neural_network_zen.py", depends-on = ["gradient_boosted_trees_zen"] }
nlp_pipeline_zen = { cmd = "python src/workflows/zenml/nlp_pipeline_zen.py", depends-on = ["neural_network_zen"] }
parallel_branches_zen = { cmd = "python src/workflows/zenml/parallel_branches_zen.py", depends-on = ["nlp_pipeline_zen"] }
timeseries_forecasting_zen = { cmd = "python src/workflows/zenml/timeseries_forecasting_zen.py", depends-on = ["parallel_branches_zen"] }
tinygrad_llm_zen = { cmd = "python src/workflows/zenml/tinygrad_llm_zen.py", depends-on = ["timeseries_forecasting_zen"] }

# ZenML cleanup task
zenml-server-down = "pixi run zenml logout"

[activation.env]
    # Core ROCm Configuration
    ROCM_PATH = "/opt/rocm"
    HSA_OVERRIDE_GFX_VERSION = "11.0.3" 
    HIP_VISIBLE_DEVICES = "0"
    PYTORCH_ROCM_ARCH = "gfx1103"
    
    # AMD GPU Memory Management (Enhanced for CNN stability)
    LIBDRM_AMDGPU_IDS_PATH = "/usr/share/libdrm/amdgpu.ids"
    HSA_ENABLE_SDMA = "0" 
    
    # Additional Memory Management Variables
    PYTORCH_ALLOC_CONF = "max_split_size_mb:128"
    HSA_FORCE_FINE_GRAIN_PCIE = "1" 
    MIOPEN_USER_DB_PATH = "/tmp/miopen_cache"
    
    # CNN-Specific Memory Fault Prevention
    ROCM_L2_CACHING = "1"
    HCC_AMDGPU_TARGET = "gfx1103"
    
    # PyTorch ROCm Optimizations
    TORCH_HIP_VISIBLE_DEVICES = "0"
    HIP_LAUNCH_BLOCKING = "0"  # For debugging: set to "1" if needed
    
    # Environment for better memory handling
    MALLOC_CONF = "background_thread:true,metadata_thp:auto,dirty_decay_ms:30000,muzzy_decay_ms:30000"
    
    # ROCm System Variables
    HSA_NO_SCRATCH_RECLAIM = "1"
    HCC_COLLECT_COUNTS = "0"

[target.linux-aarch64.dependencies]
cuda-version = "==13.0"

[dependencies]
python = ">=3.11,<3.13"
pip = ">=25.3,<26"
uv = ">=0.9.17,<0.10"
clang = ">=21.1.7,<22"

[pypi-dependencies]
metaflow = ">=2.19.4, <3"
pylint = ">=4.0.2, <5"
scikit-learn = ">=1.7.2, <2"
xgboost = ">=3.1.1, <4"
numpy = ">=2.3.4, <3"
zenml = { version = ">=0.91.0, <0.92", extras = ["server"] }
tinygrad = ">=0.11.0, <0.12"
tqdm = ">=4.67.1, <5"
tiktoken = ">=0.12.0, <0.13"
transformers = ">=4.57.1, <5"
datasets = ">=4.4.1, <5"
accelerate = ">=1.11.0, <2"
packaging = ">=25.0, <26"
ninja = ">=1.13.0, <2"
huggingface-hub = ">=0.36.0, <0.37"
gpustat = ">=1.1.1, <2"
trl = ">=0.25.1, <0.26"
nltk = ">=3.9.2, <4"
spacy = ">=3.8.11, <4"
textblob = ">=0.19.0, <0.20"

# Platform-specific torch dependencies
# CUDA version for Linux
[target.linux-aarch64.pypi-dependencies]
torch = { version = "==2.9.0", index = "https://download.pytorch.org/whl/cu130" }
torchvision = { version = "==0.24.0", index = "https://download.pytorch.org/whl/cu130" }
bitsandbytes = ">=0.48.2, <0.49"

# CPU version for macOS (CUDA not available)
[target.osx-arm64.pypi-dependencies]
torch = "==2.9.0"
torchvision = "==0.24.0"
